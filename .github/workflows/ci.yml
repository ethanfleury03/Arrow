name: Monorepo CI

on:
  push:
    branches:
      - Duraflex/main
      - Duracore/main
      - main
      - chore/**
      - feat/**
      - fix/**
      - test/**
  pull_request:
    branches:
      - Duraflex/main
      - Duracore/main
      - main

jobs:
  # ── rip-ui: full validation suite ───────────────────────────────────────────
  rip-ui:
    name: rip-ui — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rip-ui
    env:
      MEMJET_REAL_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rip-ui/package-lock.json
      - run: npm ci
      - run: npm run ci

  # ── rip-ui: unit tests (app + board) ────────────────────────────────────────
  rip-ui-unit:
    name: rip-ui — unit tests (app + board)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rip-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rip-ui/package-lock.json
      - run: npm ci
      - run: npm run test:app
      - run: npm run test:board

  # ── rip-ui: report generation ───────────────────────────────────────────────
  # Excluded (require build artifacts that only exist after a Windows build):
  #   release:manifest, handoff:bundle, test:handoff — need dist/RELEASE_MANIFEST.json
  #   test:ops, report:ops — assert all dist/ artifacts exist (snapshot.allPass)
  #   guard:completion — final gate that checks RELEASE_MANIFEST + HANDOFF_BUNDLE exist
  rip-ui-reports:
    name: rip-ui — report generation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rip-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rip-ui/package-lock.json
      - run: npm ci
      - run: >
          npm run preflight &&
          npm run report:scenarios &&
          npm run report:control &&
          npm run report:submitter &&
          npm run report:hookup &&
          npm run report:config

  # ── rip-ui: Windows build + artifact upload ──────────────────────────────────
  rip-ui-build:
    name: rip-ui — Windows build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rip-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rip-ui/package-lock.json
      - run: npm ci
      - run: npm run build:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: rip-ui-win-${{ github.sha }}
          path: rip-ui/dist/*.exe
          if-no-files-found: warn

  # ── rip-core: pytest ────────────────────────────────────────────────────────
  rip-core-adapter:
    name: rip-core — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rip-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest adapter/tests/ -v
        env:
          PYTHONPATH: adapter

  # ── rip-core: lint + type-check ─────────────────────────────────────────────
  rip-core-lint:
    name: rip-core — ruff + mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rip-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install ruff mypy
      - name: Lint (ruff)
        run: ruff check adapter/
      - name: Type check (mypy)
        run: mypy adapter/ --ignore-missing-imports

  # ── dependency audits ────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency audit (npm + pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rip-ui/package-lock.json
      - name: npm audit
        working-directory: rip-ui
        run: npm ci && npm audit --audit-level=critical

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit
        working-directory: rip-core
        run: pip install pip-audit && pip-audit -r requirements.txt
