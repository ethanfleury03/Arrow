name: Monorepo CI

on:
  push:
    branches: [main, chore/**, feat/**, fix/**]
  pull_request:
    branches: [main]

jobs:
  rip-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rip-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rip-ui/package-lock.json
      - run: npm ci
      - run: npm run ci

  rip-core-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rip-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest adapter/tests/ -v
