name: Monorepo CI

on:
  push:
    branches: [main, chore/**, feat/**, fix/**]
  pull_request:
    branches: [main]

jobs:
  rip-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rip-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rip-ui/package-lock.json
      - run: npm ci
      - run: npm test --if-present

  rip-core-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rip-core
    steps:
      - uses: actions/checkout@v4
      - run: echo "Add C++/Python build steps here once toolchain is finalized"
